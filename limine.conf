# TUS - Limine bootloader configuration
#
# Limine 12.x syntax:
#   - menu entry: a line starting with ':'
#   - option:     "key: value"
#   - path:       "resource():/path"  (boot(): = the boot medium)
#
# Note: the old Limine 5.x format (PROTOCOL=..., boot:///path, ':name'
# entries) is not accepted by Limine 12.x. Entries start with '/' and
# options use "key: value" with "resource():/path" paths. Tested with
# Limine 12.5.2.

timeout: 0

# Mirror the boot log and menu to the serial port (COM1) for debugging.
SERIAL: yes

/Toasty Unix Software (TUS)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    module_path: boot():/boot/rootfs.img
